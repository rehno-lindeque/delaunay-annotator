<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delaunay Editor</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        segmentation-editor {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
    </style>
</head>
<body>
  <div class="container">
    <segmentation-editor>
      <annotation-toolbox slot="toolbox">
        <point-tool></point-tool>
        <eraser></eraser>
        <brush background></brush>
        <brush ignore></brush>
        <brush id="pick-surface" title="Pick Surface Brush" color="red" shortcut="1"></brush>
        <brush id="body" title="Body Brush" color="yellow" shortcut="2"></brush>
        <brush id="lead" title="Lead Brush" color="royalblue" shortcut="3"></brush>
        <brush id="pad" title="Pad Brush" color="limegreen" shortcut="4"></brush>
        <brush id="joint" title="Combined solder joint & Lead Brush" color="turquoise" shortcut="5"></brush>
        <brush id="solderpaste" title="Solderpaste Brush" color="lightblue" shortcut="6"></brush>
      </annotation-toolbox>
      <delaunay-editor slot="editor"></delaunay-editor>
    </segmentation-editor>
  </div>
  <script src="annotation-toolbox.js" type="module"></script>
  <script src="delaunay-editor.js" type="module"></script>
  <script src="segmentation-editor.js" type="module"></script>
</body>
</html>
